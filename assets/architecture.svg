<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 96" width="760" height="96" role="img" aria-label="Claude Code routes through the cx router, then CLIProxyAPI, then to providers">
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7f8998"/>
    </marker>
    <style>
      .box  { fill:#181b22; stroke:#3a414d; stroke-width:1.5; rx:10; }
      .lbl  { font:600 13px -apple-system,Segoe UI,Roboto,sans-serif; fill:#d7dae0; }
      .sub  { font:400 10.5px -apple-system,Segoe UI,Roboto,sans-serif; fill:#7f8998; }
      .key  { font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#8ec7ff; }
      .ln   { stroke:#3a414d; stroke-width:1.5; fill:none; }
    </style>
  </defs>

  <!-- client -->
  <rect class="box" x="8" y="24" width="150" height="48"/>
  <text class="lbl" x="83" y="45" text-anchor="middle">Claude Code</text>
  <text class="sub" x="83" y="61" text-anchor="middle">or Codex</text>

  <line class="ln" x1="160" y1="48" x2="208" y2="48" marker-end="url(#ax)"/>

  <!-- router -->
  <rect class="box" x="210" y="16" width="190" height="64" stroke="#8ec7ff" stroke-width="2"/>
  <text class="lbl" x="305" y="42" text-anchor="middle">cx router</text>
  <text class="key" x="305" y="59" text-anchor="middle">:4000</text>
  <text class="sub" x="305" y="73" text-anchor="middle">pools · failover · cooldowns</text>

  <line class="ln" x1="402" y1="48" x2="450" y2="48" marker-end="url(#ax)"/>

  <!-- cliproxy -->
  <rect class="box" x="452" y="16" width="180" height="64"/>
  <text class="lbl" x="542" y="42" text-anchor="middle">CLIProxyAPI</text>
  <text class="key" x="542" y="59" text-anchor="middle">:8317</text>
  <text class="sub" x="542" y="73" text-anchor="middle">keys · prefixes · models</text>

  <line class="ln" x1="634" y1="48" x2="676" y2="48" marker-end="url(#ax)"/>

  <!-- providers -->
  <rect class="box" x="678" y="24" width="74" height="48"/>
  <text class="lbl" x="715" y="53" text-anchor="middle">Providers</text>
</svg>
