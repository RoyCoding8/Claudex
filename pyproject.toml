[project]
name = "cx-launcher"
version = "0.4.0"
description = "Claude Code launcher for CLIProxyAPI with an in-house pool router"
requires-python = ">=3.11,<3.14"
dependencies = [
    "prompt-toolkit>=3.0.51,<4",
    "python-dotenv>=1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modules"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long log/CLI lines are deliberate
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["data", "tmp"]
